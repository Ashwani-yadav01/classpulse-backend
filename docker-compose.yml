services:
  postgres:
    image: postgres:16-alpine
    container_name: classpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: classpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classpulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/classpulse
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FRONTEND_JOIN_URL: http://localhost:3000/join
      TEACHER_MASTER_KEY: dev-teacher-secret-key-change-in-production
      SERVER_PORT: 8080

volumes:
  postgres_data:
    driver: local
