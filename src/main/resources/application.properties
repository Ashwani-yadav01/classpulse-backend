# ==============================================================================
# ClassPulse Backend - Application Configuration Properties
# ==============================================================================

# Spring application logical name
spring.application.name=classpulse-backend

# ------------------------------------------------------------------------------
# Embedded Web Server (Tomcat) Configuration
# ------------------------------------------------------------------------------
# HTTP port on which the embedded server listens for REST and WebSocket traffic
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# PostgreSQL Database Connection & Pooling (HikariCP)
# ------------------------------------------------------------------------------
# JDBC connection string targeting PostgreSQL with environment variable overrides
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:classpulse}}
# Database authentication username
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
# Database authentication password
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
# Database JDBC driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# Validates entity mappings against database schema without modifying schema structure
spring.jpa.hibernate.ddl-auto=validate
# Disable Open-Session-In-View to prevent database connections remaining open during view rendering
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Flyway Relational Database Migrations
# ------------------------------------------------------------------------------
# Enable automated schema migration execution on application bootstrap
spring.flyway.enabled=true
# Auto-baseline pre-existing unversioned schemas on initial migration
spring.flyway.baseline-on-migrate=true
# Repair checksum discrepancies caused by OS-dependent line endings (CRLF vs LF)
spring.flyway.repair=true
# Location path of versioned SQL migration scripts
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------------------
# ClassPulse Domain Application Properties
# ------------------------------------------------------------------------------
# Web URL where students enter their join code or land after scanning QR codes
classpulse.frontend.join-url=${FRONTEND_JOIN_URL:http://localhost:3000/join}
# Administrative master key for server-to-server or test automation operations
classpulse.security.teacher-master-key=${TEACHER_MASTER_KEY:dev-teacher-secret-key-change-in-production}
# Toggles whether participants must register/sign in as students to join classroom sessions
classpulse.security.require-student-auth=${REQUIRE_STUDENT_AUTH:true}
# Default lifespan in hours for classroom sessions before automatic expiration
classpulse.session.default-duration-hours=24
# Cross-Origin Resource Sharing (CORS) allowed origin patterns for web clients
classpulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ------------------------------------------------------------------------------
# Spring Boot Actuator Observability Endpoints
# ------------------------------------------------------------------------------
# Expose health and application info endpoints over HTTP
management.endpoints.web.exposure.include=health,info
# Conditionally show granular health component details
management.endpoint.health.show-details=when-authorized
