spring.application.name=classpulse-backend-test

# Test H2 Database with PostgreSQL syntax
spring.datasource.url=jdbc:h2:mem:classpulse_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ClassPulse Test Properties
classpulse.frontend.join-url=http://localhost:3000/join
classpulse.security.teacher-master-key=test-teacher-master-key
classpulse.session.default-duration-hours=24
